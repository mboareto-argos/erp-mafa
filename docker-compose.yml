services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp_mafa
    ports:
      - "5432:5432"
    volumes:
      - erp_mafa_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres-dbs.sql:/docker-entrypoint-initdb.d/init-postgres-dbs.sql:ro

volumes:
  erp_mafa_postgres_data:
