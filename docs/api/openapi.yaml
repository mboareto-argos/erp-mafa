        - name: channel
          in: query
          schema: { type: string, enum: [presencial, whatsapp, instagram, catalogo, outro] }
        - name: status
          in: query
          schema: { type: string, enum: [draft, confirmed, cancelled, partially_returned, returned] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: object, properties: { from: { type: string, format: date-time }, to: { type: string, format: date-time } } }
                  filters: { type: object }
                  totals:
                    type: object
                    properties:
                      grossRevenue: { type: string }
                      netRevenue: { type: string }
                      cmv: { type: string }
                      grossProfit: { type: string }
                      salesCount: { type: integer }
                  sales:
                    type: array
                    items: { $ref: "#/components/schemas/Sale" }
  /reporting/top-products:
    get:
      tags: [reporting]
      summary: Produtos mais vendidos/mais lucrativos no período (requer permission:view_reports)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: orderBy
          in: query
          schema: { type: string, enum: [quantity, profit], default: quantity }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: object }
                  orderBy: { type: string }
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: { type: string, format: uuid }
                        sku: { type: string }
                        name: { type: string }
                        quantitySold: { type: string }
                        revenue: { type: string }
                        profit: { type: string }
  /reporting/inventory-value:
    get:
      tags: [reporting]
      summary: >
        Valor de estoque atual, por produto e total (RN 11.10) — foto do momento, sem período
        (requer permission:view_reports).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: string }
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: { type: string, format: uuid }
                        sku: { type: string }
                        name: { type: string }
                        quantityAvailable: { type: string }
                        unitCost: { type: string }
                        value: { type: string }
  /reporting/dre:
    get:
      tags: [reporting]
      summary: DRE gerencial simplificada do período (RN 11.5/11.6/11.7, requer permission:view_reports)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DreResponse" }
  /audit:
    get:
      tags: [audit]
      summary: >
        Trilha de auditoria da empresa, mais recentes primeiro (BR §10.23 regra 4 — requer
        permission:view_audit, exclusiva do proprietário conforme §9.1).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLog" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        TA-API-002 — chave opcional fornecida pelo cliente para evitar duplicar o efeito de um
        comando crítico em caso de reenvio (ex.: timeout de rede). Repetir a mesma chave com o
        mesmo payload devolve a resposta original; com payload diferente é tratado como uma nova
        operação, não como conflito.
      schema: { type: string, maxLength: 255 }
    SearchQuery:
      name: q
      in: query
      required: false
      description: Busca por nome (contains, case-insensitive).
      schema: { type: string }
    PageQuery:
      name: page
      in: query
      required: false
      description: >
        Presença deste parâmetro é o que ativa a paginação — sem ele a resposta é o array
        completo de sempre (retrocompatível com os seletores de produto/fornecedor/cliente
        usados em Compras/Vendas).
      schema: { type: integer, minimum: 1 }
    PageSizeQuery:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    RoleName:
      type: string
      enum: [owner, admin, sales, inventory, finance, viewer]
    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
    CompanySummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Session:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: "#/components/schemas/UserSummary" }
        company: { $ref: "#/components/schemas/CompanySummary" }
        roleName: { $ref: "#/components/schemas/RoleName" }
        permissions:
          type: array
          items: { type: string }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Brand:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        unit: { type: string }
        status: { type: string, enum: [active, inactive] }
        categoryId: { type: string, format: uuid, nullable: true }
        brandId: { type: string, format: uuid, nullable: true }
        variants:
          type: array
          description: Variantes operacionais do produto; usar id em compras, estoque e vendas.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              skuVariant: { type: string }
    PaginatedProducts:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Product" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    StockBalance:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        productVariantId: { type: string, format: uuid }
        quantityAvailable: { type: string }
        quantityReserved: { type: string }
        quantityInTransit: { type: string }
    StockMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        productVariantId: { type: string, format: uuid }
        type: { type: string, enum: [in, out, adjustment, return] }
        quantity: { type: string }
        unitCost: { type: string, nullable: true }
        originType: { type: string, enum: [purchase, adjustment, return] }
        originId: { type: string, format: uuid }
    StockAdjustment:
      type: object
      properties:
        id: { type: string, format: uuid }
        productVariantId: { type: string, format: uuid }
        stockMovementId: { type: string, format: uuid }
        reason: { type: string }
        requiresApproval: { type: boolean }
        approvedBy: { type: string, format: uuid, nullable: true }
    Supplier:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        document: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
    PaginatedSuppliers:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Supplier" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    Purchase:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [draft, ordered, partially_received, received, cancelled] }
        currency: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productVariantId: { type: string, format: uuid }
              quantity: { type: string }
              unitCostOriginCurrency: { type: string }
              quantityReceived: { type: string }
        receipts:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              receivedAt: { type: string, format: date-time }
              items:
                type: array
                items:
                  type: object
                  properties:
                    purchaseItemId: { type: string, format: uuid }
                    quantityReceived: { type: string }
                    unitCostFinal: { type: string }
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        whatsapp: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        instagram: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
    PaginatedCustomers:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    PaymentMethod:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        type: { type: string, enum: [cash, pix, debit_card, credit_card, bank_transfer, store_credit, other] }
        name: { type: string }
        feeRate: { type: string, nullable: true }
        feeFixed: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
    Sale:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        customerId: { type: string, format: uuid, nullable: true }
        channel: { type: string, enum: [presencial, whatsapp, instagram, catalogo, outro] }
        status: { type: string, enum: [draft, confirmed, cancelled, partially_returned, returned] }
        subtotal: { type: string }
        discount: { type: string }
        total: { type: string }
        cmvCalculated: { type: string, nullable: true }
        grossProfitCalculated: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productVariantId: { type: string, format: uuid }
              quantity: { type: string }
              unitPrice: { type: string }
              discount: { type: string }
              unitCostAtSale: { type: string, nullable: true }
              quantityReturned: { type: string }
        payments:
          type: array
          items:
            type: object
            properties:
              paymentMethodId: { type: string, format: uuid }
              amount: { type: string }
              feeAmount: { type: string }
              netAmount: { type: string }
        returns:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              reason: { type: string }
              items:
                type: array
                items:
                  type: object
                  properties:
                    saleItemId: { type: string, format: uuid }
                    quantity: { type: string }
                    condition: { type: string, enum: [apt, damaged] }
    FinancialAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }
    FinancialTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        financialAccountId: { type: string, format: uuid }
        type: { type: string, enum: [in, out, transfer, adjustment] }
        amount: { type: string, description: "Com sinal — positivo em entradas, negativo em saídas." }
        originType: { type: string, enum: [sale_payment, receivable_payment, payable_payment, expense, transfer, adjustment] }
        originId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    Transfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        fromAccountId: { type: string, format: uuid }
        toAccountId: { type: string, format: uuid }
        amount: { type: string }
        reason: { type: string, nullable: true }
    Receivable:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        customerId: { type: string, format: uuid, nullable: true }
        saleId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        amountOriginal: { type: string }
        amountReceived: { type: string }
        dueDate: { type: string, format: date }
        status: { type: string, enum: [pending, partially_received, received, cancelled] }
        isOverdue: { type: boolean, description: "Calculado na leitura — não é uma coluna." }
        cancelReason: { type: string, nullable: true }
    Payable:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        amountOriginal: { type: string }
        amountPaid: { type: string }
        dueDate: { type: string, format: date }
        status: { type: string, enum: [pending, partially_paid, paid, cancelled] }
        isOverdue: { type: boolean, description: "Calculado na leitura — não é uma coluna." }
        cancelReason: { type: string, nullable: true }
    Expense:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        description: { type: string }
        category: { type: string }
        amount: { type: string }
        competenceDate: { type: string, format: date }
        dueDate: { type: string, format: date, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        financialAccountId: { type: string, format: uuid, nullable: true }
        payableId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [pending, paid, cancelled] }
    DashboardResponse:
      type: object
      description: >
        cmv/grossProfit/netProfitEstimated/margin e as comparações correspondentes só aparecem
        quando o usuário tem view_cost/view_profit (RN 10.17.2).
      properties:
        period: { type: object, properties: { from: { type: string, format: date-time }, to: { type: string, format: date-time } } }
        revenueGross: { type: string }
        revenueNet: { type: string }
        salesCount: { type: integer }
        averageTicket: { type: string, nullable: true }
        expensesRealized: { type: string }
        productsCount: { type: integer }
        lowStockCount: { type: integer }
        inventoryValue: { type: string }
        receivablesOpen: { type: string }
        payablesOpen: { type: string }
        cashBalance: { type: string }
        cmv: { type: string, description: "Só com view_cost" }
        grossProfit: { type: string, description: "Só com view_profit" }
        netProfitEstimated: { type: string, description: "Só com view_profit" }
        margin: { type: string, nullable: true, description: "Só com view_profit" }
        comparison:
          type: object
          properties:
            revenueNetChangePercent: { type: string, nullable: true }
            salesCountChangePercent: { type: string, nullable: true }
            grossProfitChangePercent: { type: string, nullable: true, description: "Só com view_profit" }
            netProfitChangePercent: { type: string, nullable: true, description: "Só com view_profit" }
    DreResponse:
      type: object
      properties:
        period: { type: object }
        grossRevenue: { type: string }
        discountsAndReturns: { type: string }
        netRevenue: { type: string }
        cmv: { type: string }
        grossProfit: { type: string }
        paymentFees: { type: string }
        expenses: { type: string }
        netProfit: { type: string }
    AuditLog:
      type: object
      description: Registro de trilha de auditoria (BR §10.23) — somente leitura, append-only.
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        userId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid, nullable: true }
        beforeData: { type: object, nullable: true }
        afterData: { type: object, nullable: true }
        reason: { type: string, nullable: true }
        origin: { type: string }
        createdAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      description: Formato padrão TA-API-001 (docs/architecture/overview.md, secao 10.2)
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
            details: { type: object }
