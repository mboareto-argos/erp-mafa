openapi: 3.0.3
info:
  title: ERP MAFA Store — API
  version: "0.1.0"
  description: >
    Especificação de API gerada a partir dos controllers do Nest.js
    (apps/api). Ver convenções em docs/architecture/overview.md, seção 10.
servers:
  - url: /api/v1
tags:
  - name: auth
    description: Identity — autenticação e sessão (docs/architecture/overview.md §5, §9.1)
  - name: catalog
    description: Catalog — categorias, marcas e produtos (docs/architecture/overview.md §6.2)
  - name: inventory
    description: Inventory — saldo, movimentações e ajustes de estoque (docs/architecture/overview.md §6.3)
  - name: purchasing
    description: Purchasing — fornecedores, compras e recebimento (docs/architecture/overview.md §6.4)
  - name: customers
    description: Customers — cadastro de clientes (docs/architecture/overview.md §6.5)
  - name: payments
    description: Payments — formas de pagamento (docs/architecture/overview.md §6.6)
  - name: sales
    description: >
      Sales — vendas só à vista nesta fase (docs/architecture/overview.md §6.5).
      Venda a prazo/conta a receber ainda não existem.
  - name: financial-accounts
    description: Contas financeiras — saldo calculado por agregação (docs/architecture/overview.md §6.6)
  - name: cash-flow
    description: Fluxo de caixa — transações e transferências entre contas
  - name: receivables
    description: Contas a receber
  - name: payables
    description: Contas a pagar
  - name: expenses
    description: Despesas
  - name: reporting
    description: >
      Dashboard, relatórios e DRE gerencial (docs/architecture/overview.md §10.17/§10.18) —
      só leitura, agrega dados já existentes. Exportação e relatórios avançados (curva ABC,
      giro de estoque etc.) ainda não implementados.
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Cria User + Company + Membership(owner) e já retorna sessão ativa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, companyName]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                companyName: { type: string }
      responses:
        "201":
          description: Sessão criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409":
          description: E-mail já em uso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/login:
    post:
      tags: [auth]
      summary: Valida credenciais e retorna as empresas vinculadas + token de pré-autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Credenciais válidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  preauthToken: { type: string }
                  companies:
                    type: array
                    items:
                      type: object
                      properties:
                        companyId: { type: string, format: uuid }
                        companyName: { type: string }
                        roleName: { $ref: "#/components/schemas/RoleName" }
        "401":
          description: E-mail ou senha inválidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Usuário bloqueado ou sem vínculo com nenhuma empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/select-company:
    post:
      tags: [auth]
      summary: Troca o token de pré-auth por uma sessão escopada a uma empresa (TA-TENANT-002)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preauthToken, companyId]
              properties:
                preauthToken: { type: string }
                companyId: { type: string, format: uuid }
      responses:
        "200":
          description: Sessão criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403":
          description: Usuário não tem Membership ativo nesta empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotaciona o refresh token e emite uma nova sessão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Sessão renovada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Refresh token inválido, expirado ou revogado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoga o refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "204":
          description: Sessão revogada
  /auth/me:
    get:
      tags: [auth]
      summary: Usuário autenticado, empresa ativa, papel e permissões
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/UserSummary" }
                  company: { $ref: "#/components/schemas/CompanySummary" }
                  roleName: { $ref: "#/components/schemas/RoleName" }
                  permissions:
                    type: array
                    items: { type: string }
        "401":
          description: Não autenticado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /catalog/categories:
    post:
      tags: [catalog]
      summary: Cria categoria (requer permission:manage_catalog)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "409":
          description: Nome já em uso nesta empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [catalog]
      summary: Lista categorias da empresa ativa (requer permission:view_catalog)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
  /catalog/categories/{id}/deactivate:
    patch:
      tags: [catalog]
      summary: Inativa a categoria (nunca deleta — RN 10.4.2)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404":
          description: Não encontrada nesta empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /catalog/brands:
    post:
      tags: [catalog]
      summary: Cria marca (requer permission:manage_catalog)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brand" }
    get:
      tags: [catalog]
      summary: Lista marcas da empresa ativa (requer permission:view_catalog)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Brand" }
  /catalog/brands/{id}/deactivate:
    patch:
      tags: [catalog]
      summary: Inativa a marca (nunca deleta)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brand" }

  /catalog/products:
    post:
      tags: [catalog]
      summary: >
        Cria produto (requer permission:manage_catalog). Cria automaticamente
        uma ProductVariant padrão e, se salePrice for informado, a primeira
        linha de ProductPrice. O custo inicial é calculado como zero até o
        primeiro recebimento; ele não é aceito neste endpoint (DS-FORM-004).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, unit]
              properties:
                sku: { type: string }
                name: { type: string }
                unit: { type: string }
                categoryId: { type: string, format: uuid }
                brandId: { type: string, format: uuid }
                salePrice:
                  type: number
                  description: Preço de venda padrão inicial, opcional.
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400":
          description: categoryId/brandId inválido para esta empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: SKU já em uso nesta empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [catalog]
      summary: >
        Lista produtos da empresa ativa, com preço vigente (requer permission:view_catalog).
        Sem `page`, devolve o array completo de sempre (retrocompatível — é o que
        compras/vendas/estoque usam pra preencher seletor de produto). Com `page`, muda de
        formato para `{items,total,page,pageSize}`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/Product" }
                  - $ref: "#/components/schemas/PaginatedProducts"
  /catalog/products/{id}:
    patch:
      tags: [catalog]
      summary: >
        Edita campos cadastrais do produto (requer permission:manage_catalog). Nunca aceita
        salePrice/custo — preço só muda via /reprice; custo é calculado por recebimentos
        e nunca é aceito como edição manual (BR §10.3 regras 8-9; DS-FORM-004).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sku: { type: string }
                name: { type: string }
                unit: { type: string }
                categoryId: { type: string, format: uuid }
                brandId: { type: string, format: uuid }
                minStock: { type: number }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "409":
          description: SKU já em uso nesta empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /catalog/products/{id}/deactivate:
    patch:
      tags: [catalog]
      summary: Inativa o produto (nunca deleta — RN 10.3.3/10.3.4)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /catalog/products/{id}/reactivate:
    patch:
      tags: [catalog]
      summary: Reativa o produto (BR US-PROD-002)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /catalog/products/{id}/reprice:
    post:
      tags: [catalog]
      summary: >
        Reprecifica o produto (requer permission:manage_catalog). Nunca edita um ProductPrice
        existente — insere uma nova linha de histórico e registra auditoria com o motivo
        informado (BR §10.3 regras 8-9).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [salePrice, reason]
              properties:
                salePrice: { type: number }
                reason: { type: string }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }

  /inventory/balances:
    get:
      tags: [inventory]
      summary: Lista o saldo materializado por variante (requer permission:view_inventory)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockBalance" }
  /inventory/movements:
    get:
      tags: [inventory]
      summary: Histórico de movimentações (requer permission:view_inventory)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: productVariantId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StockMovement" }
  /inventory/low-stock:
    get:
      tags: [inventory]
      summary: Produtos com saldo disponível <= estoque mínimo (RN 10.7.8)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    productId: { type: string, format: uuid }
                    sku: { type: string }
                    name: { type: string }
                    minStock: { type: string }
                    quantityAvailable: { type: string }
  /inventory/adjustments:
    post:
      tags: [inventory]
      summary: >
        Ajuste manual de estoque (requer permission:adjust_stock). Nunca deixa o
        disponível ficar negativo (RN 10.7.6). Acima de 50 unidades marca
        requiresApproval=true (sem fila de aprovação real ainda).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productVariantId, quantity, reason]
              properties:
                productVariantId: { type: string, format: uuid }
                quantity:
                  type: number
                  description: Com sinal — positivo (entrada) ou negativo (saída).
                reason: { type: string }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  movement: { $ref: "#/components/schemas/StockMovement" }
                  adjustment: { $ref: "#/components/schemas/StockAdjustment" }
        "400":
          description: Ajuste deixaria o saldo disponível negativo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /purchasing/suppliers:
    post:
      tags: [purchasing]
      summary: Cria fornecedor (requer permission:manage_purchasing)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                document: { type: string }
                contactName: { type: string }
                phone: { type: string }
                whatsapp: { type: string }
                email: { type: string, format: email }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
    get:
      tags: [purchasing]
      summary: >
        Lista fornecedores (requer permission:view_purchasing). Sem `page`, array completo
        (retrocompatível — usado pelo seletor de fornecedor em Compras). Com `page`, formato
        `{items,total,page,pageSize}`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/Supplier" }
                  - $ref: "#/components/schemas/PaginatedSuppliers"
  /purchasing/suppliers/{id}:
    patch:
      tags: [purchasing]
      summary: Edita campos cadastrais do fornecedor (requer permission:manage_purchasing)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                document: { type: string }
                contactName: { type: string }
                phone: { type: string }
                whatsapp: { type: string }
                email: { type: string, format: email }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
  /purchasing/suppliers/{id}/deactivate:
    patch:
      tags: [purchasing]
      summary: Inativa o fornecedor (nunca deleta)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
  /purchasing/suppliers/{id}/reactivate:
    patch:
      tags: [purchasing]
      summary: Reativa o fornecedor
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }

  /purchasing/purchases:
    post:
      tags: [purchasing]
      summary: Cria uma compra em rascunho com itens (requer permission:manage_purchasing) — RN 10.6.1, não altera estoque
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                supplierId: { type: string, format: uuid }
                currency: { type: string, default: BRL }
                exchangeRate: { type: number }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productVariantId, quantity, unitCostOriginCurrency]
                    properties:
                      productVariantId: { type: string, format: uuid }
                      quantity: { type: number }
                      unitCostOriginCurrency: { type: number }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purchase" }
    get:
      tags: [purchasing]
      summary: Lista compras (requer permission:view_purchasing)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Purchase" }
  /purchasing/purchases/{id}:
    get:
      tags: [purchasing]
      summary: Detalhe da compra, com itens e recebimentos (requer permission:view_purchasing)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purchase" }
        "404":
          description: Compra não encontrada nesta empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /purchasing/purchases/{id}/order:
    post:
      tags: [purchasing]
      summary: draft → ordered (RN 10.6.2, ainda não altera estoque)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purchase" }
        "409":
          description: Compra não está em rascunho
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /purchasing/purchases/{id}/receive:
    post:
      tags: [purchasing]
      summary: >
        Recebimento total ou parcial (RN 10.6.3/10.6.4/10.6.5). Rateia custos
        adicionais proporcionalmente ao valor dos itens e delega a baixa/entrada
        de estoque ao InventoryService.receiveGoods() na mesma transação
        (TA-ARCH-003) — recalcula o custo médio móvel do produto (RN 11.4).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [purchaseItemId, quantityReceived]
                    properties:
                      purchaseItemId: { type: string, format: uuid }
                      quantityReceived: { type: number }
                additionalCosts:
                  type: array
                  items:
                    type: object
                    required: [type, amount]
                    properties:
                      type: { type: string, example: freight }
                      amount: { type: number }
      responses:
        "201":
          description: Recebido (compra atualizada, com status partially_received ou received)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purchase" }
        "400":
          description: Item inválido ou quantidade recebida maior que a comprada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Compra não está pedida/parcialmente recebida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /purchasing/purchases/{id}/cancel:
    post:
      tags: [purchasing]
      summary: >
        Cancela a compra — só permitido em draft/ordered. Cancelar uma compra
        já recebida exige estorno de estoque/custo (RN 10.6.6), não
        implementado nesta fase — retorna 409 explícito.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purchase" }
        "409":
