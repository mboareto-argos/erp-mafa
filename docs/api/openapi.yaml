      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [financialAccountId, amount]
              properties:
                financialAccountId: { type: string, format: uuid }
                amount: { type: number }
                interest: { type: number }
                discount: { type: number }
      responses:
        "201":
          description: Recebimento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receivable" }
        "400":
          description: Valor recebido supera o saldo em aberto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /receivables/{id}/cancel:
    post:
      tags: [receivables]
      summary: Cancela a conta a receber — exige motivo (RN 10.14.5)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "201":
          description: Cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receivable" }

  /payables:
    post:
      tags: [payables]
      summary: Cria conta a pagar (requer permission:manage_payables)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, amountOriginal, dueDate]
              properties:
                supplierId: { type: string, format: uuid }
                description: { type: string }
                amountOriginal: { type: number }
                dueDate: { type: string, format: date }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payable" }
    get:
      tags: [payables]
      summary: Lista contas a pagar, com isOverdue calculado na leitura (requer permission:view_payables)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payable" }
  /payables/{id}:
    get:
      tags: [payables]
      summary: Detalhe da conta a pagar (requer permission:view_payables)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payable" }
  /payables/{id}/pay:
    post:
      tags: [payables]
      summary: Registra um pagamento (requer permission:manage_payables) — nunca supera o saldo em aberto
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [financialAccountId, amount]
              properties:
                financialAccountId: { type: string, format: uuid }
                amount: { type: number }
                interest: { type: number }
                discount: { type: number }
      responses:
        "201":
          description: Pagamento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payable" }
        "400":
          description: Valor pago supera o saldo em aberto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /payables/{id}/cancel:
    post:
      tags: [payables]
      summary: Cancela a conta a pagar — exige motivo
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "201":
          description: Cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payable" }

  /expenses:
    post:
      tags: [expenses]
      summary: >
        Cria despesa (requer permission:manage_expenses). paidNow=true gera uma
        FinancialTransaction de saída direto; paidNow=false exige dueDate e gera
        automaticamente um Payable vinculado (RN 10.15.3).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, category, amount, competenceDate, paidNow]
              properties:
                description: { type: string }
                category:
                  type: string
                  enum: [mercadorias, frete, embalagem, publicidade, plataforma, telefone, internet, aluguel, energia, transporte, combustivel, taxa, imposto, manutencao, pro_labore, retirada, despesa_administrativa, perda, outra]
                amount: { type: number }
                competenceDate: { type: string, format: date }
                paidNow: { type: boolean }
                financialAccountId: { type: string, format: uuid, description: "Obrigatório quando paidNow=true" }
                dueDate: { type: string, format: date, description: "Obrigatório quando paidNow=false" }
                installmentCount: { type: integer, minimum: 1, maximum: 60, default: 1 }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
    get:
      tags: [expenses]
      summary: Lista despesas (requer permission:view_expenses)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Expense" }
  /expenses/{id}:
    get:
      tags: [expenses]
      summary: Detalhe da despesa, com o payable vinculado quando futura (requer permission:view_expenses)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
  /expenses/{id}/cancel:
    post:
      tags: [expenses]
      summary: >
        Cancela a despesa — só permitido antes de paga (RN 10.15.9); cancela também o
        Payable vinculado, se houver.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "409":
          description: Despesa já paga ou já cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /reporting/dashboard:
    get:
      tags: [reporting]
      summary: >
        Indicadores consolidados do período + comparação com o período anterior equivalente
        (requer permission:view_dashboard). O servidor compõe a resposta conforme as permissões
        de vendas, estoque, financeiro, custo e lucro do perfil; campos não autorizados são omitidos.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardResponse" }
        "400":
          description: Período ausente ou inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /reporting/sales:
    get:
      tags: [reporting]
      summary: Vendas do período com totais agregados (requer permission:view_reports)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: channel
          in: query
          schema: { type: string, enum: [presencial, whatsapp, instagram, catalogo, outro] }
        - name: status
          in: query
          schema: { type: string, enum: [draft, confirmed, cancelled, partially_returned, returned] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: object, properties: { from: { type: string, format: date-time }, to: { type: string, format: date-time } } }
                  filters: { type: object }
                  totals:
                    type: object
                    properties:
                      grossRevenue: { type: string }
                      netRevenue: { type: string }
                      cmv: { type: string }
                      grossProfit: { type: string }
                      salesCount: { type: integer }
                  sales:
                    type: array
                    items: { $ref: "#/components/schemas/Sale" }
  /reporting/top-products:
    get:
      tags: [reporting]
      summary: Produtos mais vendidos/mais lucrativos no período (requer permission:view_reports)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: orderBy
          in: query
          schema: { type: string, enum: [quantity, profit], default: quantity }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: object }
                  orderBy: { type: string }
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: { type: string, format: uuid }
                        sku: { type: string }
                        name: { type: string }
                        quantitySold: { type: string }
                        revenue: { type: string }
                        profit: { type: string }
  /reporting/inventory-value:
    get:
      tags: [reporting]
      summary: >
        Valor de estoque atual, por produto e total (RN 11.10) — foto do momento, sem período
        (requer permission:view_reports).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: string }
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: { type: string, format: uuid }
                        sku: { type: string }
                        name: { type: string }
                        quantityAvailable: { type: string }
                        unitCost: { type: string }
                        value: { type: string }
  /reporting/dre:
    get:
      tags: [reporting]
      summary: DRE gerencial simplificada do período (RN 11.5/11.6/11.7, requer permission:view_reports)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DreResponse" }
  /audit:
    get:
      tags: [audit]
      summary: >
        Trilha de auditoria da empresa, mais recentes primeiro (BR §10.23 regra 4 — requer
        permission:view_audit, exclusiva do proprietário conforme §9.1).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLog" }

  /imports/{entityType}/template:
    get:
      tags: [imports]
      summary: >
        Modelo CSV (cabeçalho fixo) para o tipo de entidade (BR §10.19, passo "baixar modelo").
        Requer permission:manage_imports.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: entityType
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ImportEntityType" }
      responses:
        "200":
          description: CSV com só a linha de cabeçalho
          content:
            text/csv:
              schema: { type: string }
  /imports/{entityType}/preview:
    post:
      tags: [imports]
      summary: >
        Dry-run (BR §10.19 regra 1): parseia e valida o CSV sem persistir nada. Para produtos,
        aponta duplicateMatch quando o SKU/nome/alias já existe (RN-IMP-001/002).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: entityType
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ImportEntityType" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/ImportPreviewRow" }
                  summary:
                    type: object
                    properties:
                      toCreate: { type: integer }
                      toReview: { type: integer }
                      toReject: { type: integer }
  /imports/{entityType}/confirm:
    post:
      tags: [imports]
      summary: >
        Persiste as linhas revisadas (BR §10.19 regras 2-5): nenhuma linha inválida é criada,
        duplicidade de produto exige duplicateAction, cria um ImportJob + ImportRow por linha.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: entityType
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ImportEntityType" }
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                fileName: { type: string }
                rows:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [cells]
                    properties:
                      cells: { type: object, additionalProperties: { type: string } }
                      duplicateAction:
                        { $ref: "#/components/schemas/ImportDuplicateAction" }
                expectedTotal:
                  type: number
                  description: Total da planilha original, usado na reconciliação (BR §34.8).
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
  /imports:
    get:
      tags: [imports]
      summary: Histórico de importações da empresa (BR §10.19 regra 6). Requer permission:manage_imports.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportJob" }
  /imports/{id}:
    get:
      tags: [imports]
      summary: Detalhe de uma importação, com contagens e linhas. Requer permission:manage_imports.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
  /imports/{id}/revert:
    post:
      tags: [imports]
      summary: >
        Reverte uma importação concluída (BR §34.8: "reversível antes do aceite final") —
        inativa as entidades criadas e lança ajuste compensatório de estoque quando aplicável.
        Nunca apaga linha (TA-DATA-001). Só permitido uma vez por importação.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "409":
          description: Importação já revertida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        TA-API-002 — chave opcional fornecida pelo cliente para evitar duplicar o efeito de um
        comando crítico em caso de reenvio (ex.: timeout de rede). Repetir a mesma chave com o
        mesmo payload devolve a resposta original; com payload diferente é tratado como uma nova
        operação, não como conflito.
      schema: { type: string, maxLength: 255 }
    SearchQuery:
      name: q
      in: query
      required: false
      description: Busca por nome (contains, case-insensitive).
      schema: { type: string }
    PageQuery:
      name: page
      in: query
      required: false
      description: >
        Presença deste parâmetro é o que ativa a paginação — sem ele a resposta é o array
        completo de sempre (retrocompatível com os seletores de produto/fornecedor/cliente
        usados em Compras/Vendas).
      schema: { type: integer, minimum: 1 }
    PageSizeQuery:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    RoleName:
      type: string
      enum: [owner, admin, sales, inventory, finance, viewer]
    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
    CompanySummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Session:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: "#/components/schemas/UserSummary" }
        company: { $ref: "#/components/schemas/CompanySummary" }
        roleName: { $ref: "#/components/schemas/RoleName" }
        permissions:
          type: array
          items: { type: string }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Brand:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        unit: { type: string }
        status: { type: string, enum: [active, inactive] }
        categoryId: { type: string, format: uuid, nullable: true }
        brandId: { type: string, format: uuid, nullable: true }
        variants:
          type: array
          description: Variantes operacionais do produto; usar id em compras, estoque e vendas.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              skuVariant: { type: string }
        prices:
          type: array
          description: Na listagem contém somente o preço vigente; no detalhe contém o histórico completo, do mais recente ao mais antigo.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              salePrice: { type: string }
              costPrice: { type: string, description: Calculado; nunca editável diretamente. }
              effectiveFrom: { type: string, format: date-time }
    PaginatedProducts:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Product" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    StockBalance:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        productVariantId: { type: string, format: uuid }
        quantityAvailable: { type: string }
        quantityReserved: { type: string }
        quantityInTransit: { type: string }
    StockMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        productVariantId: { type: string, format: uuid }
        type: { type: string, enum: [in, out, adjustment, return] }
        quantity: { type: string }
        unitCost: { type: string, nullable: true }
        originType: { type: string, enum: [purchase, adjustment, return, sale] }
        originId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        adjustment:
          allOf:
            - $ref: "#/components/schemas/StockAdjustment"
          nullable: true
        productVariant:
          type: object
          description: Variação e produto incluídos na consulta de movimentações para identificação no histórico.
    StockAdjustment:
      type: object
      properties:
        id: { type: string, format: uuid }
        productVariantId: { type: string, format: uuid }
        stockMovementId: { type: string, format: uuid }
        reason: { type: string }
        requiresApproval: { type: boolean }
        approvedBy: { type: string, format: uuid, nullable: true }
    Supplier:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        document: { type: string, nullable: true }
        contactName: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        whatsapp: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        status: { type: string, enum: [active, inactive] }
    SupplierDetail:
      allOf:
        - $ref: "#/components/schemas/Supplier"
        - type: object
          properties:
            summary:
              type: object
              properties:
                purchasesCount: { type: integer }
                totalPurchased: { type: string }
                averagePurchase: { type: string }
                lastPurchaseAt: { type: string, format: date-time, nullable: true }
                productsSupplied: { type: integer }
                outstandingBalance: { type: string }
            recentPurchases:
              type: array
              maxItems: 5
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  currency: { type: string }
                  total: { type: string }
                  createdAt: { type: string, format: date-time }
                  itemsCount: { type: integer }
    PaginatedSuppliers:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Supplier" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    Purchase:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [draft, ordered, partially_received, received, cancelled] }
        currency: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productVariantId: { type: string, format: uuid }
              quantity: { type: string }
              unitCostOriginCurrency: { type: string }
              quantityReceived: { type: string }
        receipts:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              receivedAt: { type: string, format: date-time }
              items:
                type: array
                items:
                  type: object
                  properties:
                    purchaseItemId: { type: string, format: uuid }
                    quantityReceived: { type: string }
                    unitCostFinal: { type: string }
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        whatsapp: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        instagram: { type: string, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, inactive] }
    CustomerDetail:
      allOf:
        - $ref: "#/components/schemas/Customer"
        - type: object
          properties:
            summary:
              type: object
              properties:
                salesCount: { type: integer }
                totalPurchased: { type: string }
                averageTicket: { type: string }
                lastPurchaseAt: { type: string, format: date-time, nullable: true }
                productsPurchased: { type: integer }
                outstandingBalance: { type: string }
            recentSales:
              type: array
              maxItems: 5
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  total: { type: string }
                  createdAt: { type: string, format: date-time }
    PaginatedCustomers:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    PaymentMethod:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        type: { type: string, enum: [cash, pix, debit_card, credit_card, bank_transfer, store_credit, other] }
        name: { type: string }
        feeRate: { type: string, nullable: true }
        feeFixed: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
    Sale:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        customerId: { type: string, format: uuid, nullable: true }
        channel: { type: string, enum: [presencial, whatsapp, instagram, catalogo, outro] }
        status: { type: string, enum: [draft, confirmed, cancelled, partially_returned, returned] }
        subtotal: { type: string }
        discount: { type: string }
        total: { type: string }
        cmvCalculated: { type: string, nullable: true }
        grossProfitCalculated: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productVariantId: { type: string, format: uuid }
              quantity: { type: string }
              unitPrice: { type: string }
              discount: { type: string }
              unitCostAtSale: { type: string, nullable: true }
              quantityReturned: { type: string }
        payments:
          type: array
          items:
            type: object
            properties:
              paymentMethodId: { type: string, format: uuid }
              amount: { type: string }
              feeAmount: { type: string }
              netAmount: { type: string }
        returns:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              reason: { type: string }
              items:
                type: array
                items:
                  type: object
                  properties:
                    saleItemId: { type: string, format: uuid }
                    quantity: { type: string }
                    condition: { type: string, enum: [apt, damaged] }
    FinancialAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }
    FinancialTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        financialAccountId: { type: string, format: uuid }
        type: { type: string, enum: [in, out, transfer, adjustment] }
        amount: { type: string, description: "Com sinal — positivo em entradas, negativo em saídas." }
        originType: { type: string, enum: [sale_payment, receivable_payment, payable_payment, expense, transfer, adjustment] }
        originId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    Transfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        fromAccountId: { type: string, format: uuid }
        toAccountId: { type: string, format: uuid }
        amount: { type: string }
        reason: { type: string, nullable: true }
    Receivable:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        customerId: { type: string, format: uuid, nullable: true }
        saleId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        amountOriginal: { type: string }
        amountReceived: { type: string }
        dueDate: { type: string, format: date }
        status: { type: string, enum: [pending, partially_received, received, cancelled] }
        isOverdue: { type: boolean, description: "Calculado na leitura — não é uma coluna." }
        cancelReason: { type: string, nullable: true }
    Payable:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        amountOriginal: { type: string }
        amountPaid: { type: string }
        dueDate: { type: string, format: date }
        status: { type: string, enum: [pending, partially_paid, paid, cancelled] }
        isOverdue: { type: boolean, description: "Calculado na leitura — não é uma coluna." }
        cancelReason: { type: string, nullable: true }
    Expense:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        description: { type: string }
        category: { type: string }
        amount: { type: string }
        competenceDate: { type: string, format: date }
        dueDate: { type: string, format: date, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        financialAccountId: { type: string, format: uuid, nullable: true }
        payableId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [pending, paid, cancelled] }
    DashboardResponse:
      type: object
      description: >
        Resposta polimórfica por permissão. Métricas de vendas exigem view_sales; estoque exige
        view_inventory; valores financeiros exigem suas permissões específicas; CMV/lucro exigem
        view_cost/view_profit. Campos sem autorização são omitidos no servidor (RN 10.17.1/2).
      properties:
        period: { type: object, properties: { from: { type: string, format: date-time }, to: { type: string, format: date-time } } }
        revenueGross: { type: string }
        revenueNet: { type: string }
        salesCount: { type: integer }
        averageTicket: { type: string, nullable: true }
        expensesRealized: { type: string }
        productsCount: { type: integer }
        lowStockCount: { type: integer }
        inventoryValue: { type: string }
        receivablesOpen: { type: string }
        overdueReceivablesCount: { type: integer }
        payablesOpen: { type: string }
        overduePayablesCount: { type: integer }
        cashBalance: { type: string }
        cmv: { type: string, description: "Só com view_cost" }
        grossProfit: { type: string, description: "Só com view_profit" }
        netProfitEstimated: { type: string, description: "Só com view_profit" }
        margin: { type: string, nullable: true, description: "Só com view_profit" }
        comparison:
          type: object
          properties:
            revenueNetChangePercent: { type: string, nullable: true }
            salesCountChangePercent: { type: string, nullable: true }
            grossProfitChangePercent: { type: string, nullable: true, description: "Só com view_profit" }
            netProfitChangePercent: { type: string, nullable: true, description: "Só com view_profit" }
        salesTrend:
          type: array
          description: "Só com view_sales; série diária das vendas válidas do período."
          items:
            type: object
            properties:
              date: { type: string, format: date }
              revenue: { type: string }
              salesCount: { type: integer }
        topProducts:
          type: array
          description: "Só com view_sales; profit é omitido sem view_profit."
          items:
            type: object
            properties:
              productId: { type: string, format: uuid }
              sku: { type: string }
              name: { type: string }
              quantitySold: { type: string }
              revenue: { type: string }
              profit: { type: string, description: "Só com view_profit" }
    DreResponse:
      type: object
      properties:
        period: { type: object }
        grossRevenue: { type: string }
        discountsAndReturns: { type: string }
        netRevenue: { type: string }
        cmv: { type: string }
        grossProfit: { type: string }
        paymentFees: { type: string }
        expenses: { type: string }
        netProfit: { type: string }
        profitDistribution:
          type: object
          description: Aplicada após o lucro líquido; base zero quando o resultado não é positivo.
          properties:
            applied: { type: boolean }
            effectiveFrom: { type: string, format: date, nullable: true }
            baseAmount: { type: string }
            reinvestment: { type: object }
            proLabore: { type: object }
            reserve: { type: object }
            marketing: { type: object }
    AuditLog:
      type: object
      description: Registro de trilha de auditoria (BR §10.23) — somente leitura, append-only.
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        userId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid, nullable: true }
        beforeData: { type: object, nullable: true }
        afterData: { type: object, nullable: true }
        reason: { type: string, nullable: true }
        origin: { type: string }
        createdAt: { type: string, format: date-time }
    ImportEntityType:
      type: string
      enum: [product, initial_stock, customer, supplier, expense, payable, receivable]
    ImportDuplicateAction:
      type: string
      enum: [use_existing, create_new, register_alias, ignore]
      description: RN-IMP-002 — só relevante quando a linha teve duplicateMatch no preview.
    ImportRowStatus:
      type: string
      enum: [created, updated, skipped, rejected]
    ImportPreviewRow:
      type: object
      properties:
        rowNumber: { type: integer }
        cells: { type: object, additionalProperties: { type: string } }
        data: { type: object, nullable: true }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: string }
        duplicateMatch:
          type: object
          nullable: true
          properties:
            entityId: { type: string, format: uuid }
            entityLabel: { type: string }
            matchedBy: { type: string, enum: [sku, name, alias] }
    ImportRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        rowNumber: { type: integer }
        rawData: { type: object, additionalProperties: { type: string } }
        status: { $ref: "#/components/schemas/ImportRowStatus" }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: string }
        resultEntityType: { type: string, nullable: true }
        resultEntityId: { type: string, format: uuid, nullable: true }
        duplicateAction:
          type: string
          nullable: true
          enum: [use_existing, create_new, register_alias, ignore]
    ImportJob:
      type: object
      description: >
        BR §10.19/§34.8 — resultado de uma confirmação de importação. reconciledTotal/
        expectedTotal/divergence só aparecem para tipos de entidade com valor por linha
        (despesas, contas a pagar/receber).
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        entityType: { $ref: "#/components/schemas/ImportEntityType" }
        status: { type: string, enum: [completed, reverted] }
        fileName: { type: string, nullable: true }
        totalRows: { type: integer }
        createdCount: { type: integer }
        updatedCount: { type: integer }
        skippedCount: { type: integer }
        rejectedCount: { type: integer }
        expectedTotal: { type: string, nullable: true }
        reconciledTotal: { type: string, nullable: true }
        divergence: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        revertedAt: { type: string, format: date-time, nullable: true }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ImportRow" }
    ErrorResponse:
      type: object
      description: Formato padrão TA-API-001 (docs/architecture/overview.md, secao 10.2)
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
            details: { type: object }
