  /sales:
    post:
      tags: [sales]
      summary: Cria venda em rascunho com itens (requer permission:manage_sales) — RN 10.10.1, não altera estoque
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, items]
              properties:
                customerId: { type: string, format: uuid }
                channel: { type: string, enum: [presencial, whatsapp, instagram, catalogo, outro] }
                discount: { type: number, default: 0, description: Desconto geral da venda }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productVariantId, quantity, unitPrice]
                    properties:
                      productVariantId: { type: string, format: uuid }
                      quantity: { type: number }
                      unitPrice: { type: number }
                      discount: { type: number, default: 0 }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
    get:
      tags: [sales]
      summary: Lista vendas (requer permission:view_sales)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sale" }
  /sales/{id}:
    get:
      tags: [sales]
      summary: Detalhe da venda, com itens/pagamentos/devoluções (requer permission:view_sales)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "404":
          description: Venda não encontrada nesta empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /sales/{id}/confirm:
    post:
      tags: [sales]
      summary: >
        Confirma a venda: congela o custo por item, baixa estoque via
        InventoryService.releaseStock() na mesma transação (TA-ARCH-003),
        registra os pagamentos (só à vista — a soma precisa bater exatamente
        com o total) e calcula CMV/lucro bruto.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payments]
              properties:
                payments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [paymentMethodId, amount]
                    properties:
                      paymentMethodId: { type: string, format: uuid }
                      amount: { type: number }
      responses:
        "201":
          description: Confirmada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400":
          description: Estoque insuficiente ou soma dos pagamentos diferente do total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Venda não está em rascunho
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /sales/{id}/cancel:
    post:
      tags: [sales]
      summary: >
        Cancela a venda — permitido em draft (sem efeito) e confirmed
        (restaura o estoque ainda não devolvido). Bloqueado se já
        returned/partially_returned/cancelled.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "409":
          description: Status da venda não permite cancelamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /sales/{id}/return:
    post:
      tags: [sales]
      summary: >
        Devolução parcial ou total (RN 10.11). Item apto restaura estoque;
        item avariado só é registrado (não volta ao estoque disponível
        nesta fase). Recalcula receita líquida e CMV/lucro proporcionalmente.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, items]
              properties:
                reason: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [saleItemId, quantity, condition]
                    properties:
                      saleItemId: { type: string, format: uuid }
                      quantity: { type: number }
                      condition: { type: string, enum: [apt, damaged] }
      responses:
        "201":
          description: Devolução registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400":
          description: Item inválido ou quantidade devolvida maior que a vendida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Status da venda não permite devolução
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

