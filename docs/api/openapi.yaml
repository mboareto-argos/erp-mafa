      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purchase" }
        "404":
          description: Compra não encontrada nesta empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      tags: [purchasing]
      summary: Substitui os dados e itens de uma compra em rascunho (requer permission:manage_purchasing)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                supplierId: { type: string, format: uuid }
                currency: { type: string, default: BRL }
                exchangeRate: { type: number }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productVariantId, quantity, unitCostOriginCurrency]
                    properties:
                      productVariantId: { type: string, format: uuid }
                      quantity: { type: number }
                      unitCostOriginCurrency: { type: number }
      responses:
        "200":
          description: Rascunho atualizado; itens anteriores preservados como inativos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purchase" }
        "409":
          description: Compra não está em rascunho
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /purchasing/purchases/{id}/order:
    post:
      tags: [purchasing]
      summary: draft → ordered (RN 10.6.2, ainda não altera estoque)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purchase" }
        "409":
          description: Compra não está em rascunho
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /purchasing/purchases/{id}/receive:
    post:
      tags: [purchasing]
      summary: >
        Recebimento total ou parcial (RN 10.6.3/10.6.4/10.6.5). Rateia custos
        adicionais proporcionalmente ao valor dos itens e delega a baixa/entrada
        de estoque ao InventoryService.receiveGoods() na mesma transação
        (TA-ARCH-003) — recalcula o custo médio móvel do produto (RN 11.4).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [purchaseItemId, quantityReceived]
                    properties:
                      purchaseItemId: { type: string, format: uuid }
                      quantityReceived: { type: number }
                additionalCosts:
                  type: array
                  items:
                    type: object
                    required: [type, amount]
                    properties:
                      type: { type: string, example: freight }
                      amount: { type: number }
                installmentPlan:
                  type: object
                  description: Quando informado no recebimento final, gera contas a pagar.
                  properties:
                    count: { type: integer, minimum: 1, maximum: 60 }
                    firstDueDate: { type: string, format: date }
      responses:
        "201":
          description: Recebido (compra atualizada, com status partially_received ou received)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purchase" }
        "400":
          description: Item inválido ou quantidade recebida maior que a comprada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Compra não está pedida/parcialmente recebida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /purchasing/purchases/{id}/cancel:
    post:
      tags: [purchasing]
      summary: >
        Cancela a compra antes do recebimento. Compras recebidas usam o endpoint
        explícito de estorno para preservar a rastreabilidade.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: Cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purchase" }
        "409":
          description: Compra já recebida ou já cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /purchasing/purchases/{id}/reverse:
    post:
      tags: [purchasing]
      summary: Estorna estoque, custo e parcelas não pagas de uma compra recebida
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
